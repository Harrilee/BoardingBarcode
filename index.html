}

function start()
{
    run = Module.cwrap('run', null, ['number', 'string', 'number', 'number'])
    stdCtx = standaloneCanvas.getContext('2d')

    detectInitialLang()

    loadRows()
    if (rows.length === 0) rows.push(defaultRow())

    applyLang()
}

function detectInitialLang() {
    /* Priority: URL ?lang= (shareable links / hreflang) > localStorage > navigator */
    try {
        var fromUrl = new URLSearchParams(window.location.search).get('lang')
        if (fromUrl === 'en' || fromUrl === 'zh') { currentLang = fromUrl; return }
    } catch (e) {}
    var saved = null
    try { saved = localStorage.getItem(STORAGE_LANG) } catch (e) {}
    if (saved === 'en' || saved === 'zh') { currentLang = saved; return }
    var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase()
    currentLang = nav.indexOf('zh') === 0 ? 'zh' : 'en'
}

function applyLang() {
    document.documentElement.setAttribute('lang', currentLang === 'zh' ? 'zh-CN' : 'en')
    document.title = t('page_title')
    var els = document.querySelectorAll('[data-i18n]')
    els.forEach(function(el) { el.textContent = t(el.getAttribute('data-i18n')) })
    var elsT = document.querySelectorAll('[data-i18n-title]')
    elsT.forEach(function(el) { el.title = t(el.getAttribute('data-i18n-title')) })
    var langBtn = document.getElementById('langBtn')
    if (langBtn) langBtn.textContent = t('lang_toggle')
    // Toolbar buttons that have data-i18n already handled; tables/gallery need re-render
    var advBox = document.getElementById('advanced')
    var advBtn = document.getElementById('advToggle')
    if (advBtn) advBtn.textContent = (advBox && advBox.classList.contains('open')) ? t('adv_open') : t('adv_closed')
    renderTable()
    rebuildGallery()
    updateAll()
}
function toggleLang() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh'
    try { localStorage.setItem(STORAGE_LANG, currentLang) } catch (e) {}
    /* Update URL so the chosen language survives sharing/bookmarking */
    try {
        var url = new URL(window.location.href)
        url.searchParams.set('lang', currentLang)
        window.history.replaceState({}, '', url)
    } catch (e) {}
    applyLang()
}

function defaultRow() {
    return {
        firstName: 'John',
        lastName:  'Doe',
        bookRef:   'XYZ123',
        from:      'ZRH',
        to:        'SFO',
        fOp:       'BA',
        fNum:      '1234',
        date:      todayInputValue(),
        cls:       'F',
        seat:      '35A',
        seqNum:    '0001'
    }
}

function todayInputValue() {
    var local = new Date()
    return local.toJSON().slice(0, 10)
}

function saveRows() {
    try { localStorage.setItem(STORAGE_ROWS, JSON.stringify({ rows: rows, active: activeRowIdx })) }
    catch (e) {}
}
function loadRows() {
    try {
        var raw = localStorage.getItem(STORAGE_ROWS)
        if (!raw) return
        var data = JSON.parse(raw)
        if (data && Array.isArray(data.rows)) {
            rows = data.rows
            activeRowIdx = Math.min(data.active || 0, rows.length - 1)
        }
    } catch (e) {}
}

function addNewRow() {
    rows.push(defaultRow())
    activeRowIdx = rows.length - 1
    renderTable()
    rebuildGallery()
    updateAll()
    saveRows()
    scrollToLast()
}

function copyActiveRow() {
    var src = rows[activeRowIdx] || defaultRow()
    var copy = {}
    for (var k in src) copy[k] = src[k]
    rows.push(copy)
    activeRowIdx = rows.length - 1
    renderTable()
    rebuildGallery()
    updateAll()
    saveRows()
    scrollToLast()
}

function scrollToLast() {
    var el = document.getElementById('mockerGallery')
    if (el && el.lastElementChild) el.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' })
}

function deleteRow(idx) {
    if (rows.length <= 1) return
    var name = ((rows[idx].firstName || '') + ' ' + (rows[idx].lastName || '')).trim() || '?'
    if (!confirm(tf('confirm_delete', { name: name }))) return
    rows.splice(idx, 1)
    if (activeRowIdx >= rows.length) activeRowIdx = rows.length - 1
    renderTable()
    rebuildGallery()
    updateAll()
    saveRows()
}

function selectRow(idx) {
    activeRowIdx = idx
    renderTable()
    updateStandalone()
    saveRows()
}

function onCellInput(idx, key, val, fdef) {
    if (fdef && fdef.upper) val = val.toUpperCase()
    rows[idx][key] = val
    if (idx === activeRowIdx) updateStandalone()
    updateMockerCard(idx)
    saveRows()
}

function renderTable() {
    var thead = document.getElementById('rowsThead')
    var tbody = document.getElementById('rowsTbody')

    thead.innerHTML = ''
    var htr = document.createElement('tr')
    var thIdx = document.createElement('th'); thIdx.textContent = t('col_num'); thIdx.title = t('col_num_t'); htr.appendChild(thIdx)
    var thSel = document.createElement('th'); thSel.textContent = ''; thSel.title = t('active_title'); htr.appendChild(thSel)
    FIELDS.forEach(function(f) {
        var th = document.createElement('th')
        th.textContent = t(f.labelKey)
        th.title = t(f.titleKey)
        htr.appendChild(th)
    })
    var thAction = document.createElement('th'); htr.appendChild(thAction)
    thead.appendChild(htr)

    tbody.innerHTML = ''
    rows.forEach(function(r, i) {
        var tr = document.createElement('tr')
        if (i === activeRowIdx) tr.className = 'activeRow'

        var tdIdx = document.createElement('td')
        tdIdx.className = 'rowNum'
        tdIdx.textContent = (i + 1)
        tr.appendChild(tdIdx)

        var tdSel = document.createElement('td')
        var radio = document.createElement('input')
        radio.type = 'radio'
        radio.name = 'rowSel'
        radio.checked = (i === activeRowIdx)
        radio.title = t('active_title')
        radio.onchange = function() { selectRow(i) }
        tdSel.appendChild(radio)
        tr.appendChild(tdSel)

        FIELDS.forEach(function(f) {
            var td = document.createElement('td')
            var inp
            if (f.type === 'select') {
                inp = document.createElement('select')
                f.opts.forEach(function(o) {
                    var opt = document.createElement('option')
                    opt.value = o[0]
                    opt.textContent = t(o[1])
                    if (r[f.key] === o[0]) opt.selected = true
                    inp.appendChild(opt)
                })
                inp.onchange = function() { onCellInput(i, f.key, inp.value, f) }
            } else {
                inp = document.createElement('input')
                inp.type = f.type || 'text'
                inp.value = r[f.key]
                if (f.max) inp.maxLength = f.max
                if (f.placeholder) inp.placeholder = f.placeholder
                if (f.upper) inp.style.textTransform = 'uppercase'
                inp.oninput = function() {
                    if (f.upper) inp.value = inp.value.toUpperCase()
                    onCellInput(i, f.key, inp.value, f)
                }
            }
            inp.style.width = (f.width - 8) + 'px'
            inp.onfocus = function() { if (i !== activeRowIdx) selectRow(i) }
            td.appendChild(inp)
            tr.appendChild(td)
        })

        var tdAct = document.createElement('td')
        var del = document.createElement('button')
        del.textContent = '×'
        del.title = t('delete_title')
        del.className = 'delBtn'
        del.disabled = rows.length <= 1
        del.onclick = function() { deleteRow(i) }
        tdAct.appendChild(del)
        tr.appendChild(tdAct)

        tbody.appendChild(tr)
    })
}

function errclear() {
    errMsg.innerHTML = ''
    errMsg.style.visibility = 'hidden'
}
function err(msg) {
    if (errMsg.innerHTML == '') {
        errMsg.innerHTML = msg
        errMsg.style.visibility = 'visible'
    }
}

function upPadRight(s, n) {
    s = (s || '').toUpperCase()
    while (s.length < n) s = s + ' '
    return s.substr(0, n)
}
function padLeft(s, n) {
    s = ((s || '') + '').toUpperCase()
    while (s.length < n) s = '0' + s
    return s.substr(0, n)
}
function dayOfYear(yr, mon, mday) {
    var now = new Date(yr, mon, mday, 1, 0, 0)
    var start = new Date(yr, 0, 1, 0, 0)
    var diff = now - start
    var oneDay = 1000 * 60 * 60 * 24
    return Math.floor(diff / oneDay) + 1
}

var FLD_DEF = {
    bookRef: { pad: 7, desc: 'col_pnr' },
    from:    { pad: 3, desc: 'col_from' },
    to:      { pad: 3, desc: 'col_to' },
    fOp:     { pad: 3, desc: 'col_op' },
    fNum:    { pad: 5, desc: 'col_flt' }
}

function buildFields(r) {
    errclear()
    if ((r.lastName || '').length > 18) err(t('err_lastname_long'))
    var v = (r.lastName || '') + '/' + (r.firstName || '')
    if (v.length > 21) err(t('err_name_long'))
    fields.name = upPadRight(v, 20)

    Object.keys(FLD_DEF).forEach(function(k) {
        var def = FLD_DEF[k]
        var val = r[k] || ''
        if (val.length > def.pad)
            err(tf('err_field_long', { name: t(def.desc), n: def.pad }))
        fields[k] = upPadRight(val, def.pad)
    })

    var dl = (r.date || todayInputValue()).split('-')
    var day = dayOfYear(parseInt(dl[0]), parseInt(dl[1]) - 1, parseInt(dl[2]))
    fields.date = padLeft('' + day, 3)
    fields.cls = r.cls
    fields.seat = padLeft(r.seat || '', 4)
    fields.seqNum = upPadRight(padLeft(r.seqNum || '', 4), 5)
}

function buildBcbpText(r) {
    buildFields(r)
    return 'M1' + fields.name + 'E' + fields.bookRef + fields.from + fields.to
         + fields.fOp + fields.fNum + fields.date + fields.cls + fields.seat + fields.seqNum
         + '1' + '00'
}

function svgToObjectUrl(svgText) {
    var blob = new Blob([svgText], { type: 'image/svg+xml' })
    return URL.createObjectURL(blob)
}
function setImgSvg(img, svgText) {
    var prev = img.dataset.url
    var url = svgToObjectUrl(svgText)
    img.src = url
    img.dataset.url = url
    if (prev) setTimeout(function() { URL.revokeObjectURL(prev) }, 50)
}

function updateAll() {
    rows.forEach(function(_, i) { updateMockerCard(i) })
    updateStandalone()
}

function updateStandalone() {
    var r = rows[activeRowIdx]
    if (!r) return
    var ttxt = buildBcbpText(r)
    textIn = ttxt
    textEdit.value = ttxt

    var ecc = parseInt(eccSelect.value)
    var ssize = parseInt(symSize.value)
    var btype = parseInt(codeTypeSel.value)
    run(btype, ttxt, ecc, ssize)
    var svg = textOut

    var img = standaloneImg
    img.onload = function() {
        standaloneCanvas.width = img.naturalWidth
        standaloneCanvas.height = img.naturalHeight
        stdCtx.drawImage(img, 0, 0)
    }
    setImgSvg(img, svg)
}

function updateRaw() {
    textIn = textEdit.value
    var ecc = parseInt(eccSelect.value)
    var ssize = parseInt(symSize.value)
    var btype = parseInt(codeTypeSel.value)
    run(btype, textIn, ecc, ssize)
    var svg = textOut
    var img = standaloneImg
    img.onload = function() {
        standaloneCanvas.width = img.naturalWidth
        standaloneCanvas.height = img.naturalHeight
        stdCtx.drawImage(img, 0, 0)
    }
    setImgSvg(img, svg)
}

function typeUpdate() {
    if (codeTypeSel.value == '0') symSize.value = '11'
    else symSize.value = '6'
    updateStandalone()
}

function rebuildGallery() {
    var gallery = document.getElementById('mockerGallery')
    while (gallery.children.length < rows.length) {
        gallery.appendChild(createMockerCard(gallery.children.length))
    }
    while (gallery.children.length > rows.length) {
        var last = gallery.lastChild
        var imgs = last.getElementsByTagName('img')
        for (var i = 0; i < imgs.length; i++) {
            if (imgs[i].dataset.url) URL.revokeObjectURL(imgs[i].dataset.url)
        }
        gallery.removeChild(last)
    }
    rows.forEach(function(_, i) {
        var card = gallery.children[i]
        card.dataset.idx = i
        card.querySelector('.m-passnum').textContent = '#' + (i + 1)
        card.querySelector('.m-title').textContent = t('m_title')
        card.querySelector('.m-label-passenger').textContent = t('m_passenger')
        card.querySelector('.m-label-pnr').textContent = t('m_pnr')
        card.querySelector('.m-label-flight').textContent = t('m_flight')
        card.querySelector('.m-label-date').textContent = t('m_date')
        card.querySelector('.m-label-class').textContent = t('m_class')
        card.querySelector('.m-label-seat').textContent = t('m_seat')
        card.querySelector('.m-label-seq').textContent = t('m_seq')
        card.querySelector('.m-label-from').textContent = t('m_from')
        card.querySelector('.m-label-to').textContent = t('m_to')
    })
}

function createMockerCard(idx) {
    var card = document.createElement('div')
    card.className = 'mocker'
    card.innerHTML =
        '<div class="m-header">'
        + '<div class="m-title"></div>'
        + '<div class="m-passnum"></div>'
        + '</div>'
        + '<div class="m-body">'
        +   '<div class="m-top-row">'
        +     '<div class="m-field m-name-field"><span class="m-label m-label-passenger"></span><span class="m-val m-name"></span></div>'
        +     '<div class="m-field m-pnr-field"><span class="m-label m-label-pnr"></span><span class="m-val m-pnr"></span></div>'
        +   '</div>'
        +   '<div class="m-route">'
        +     '<div class="m-airport-block"><div class="m-airport m-from"></div><div class="m-label m-label-from"></div></div>'
        +     '<div class="m-arrow">━━━ ✈ ━━━▶</div>'
        +     '<div class="m-airport-block right"><div class="m-airport m-to"></div><div class="m-label m-label-to"></div></div>'
        +   '</div>'
        +   '<div class="m-grid">'
        +     '<div class="m-field"><span class="m-label m-label-flight"></span><span class="m-val m-flight"></span></div>'
        +     '<div class="m-field"><span class="m-label m-label-date"></span><span class="m-val m-date"></span></div>'
        +     '<div class="m-field"><span class="m-label m-label-class"></span><span class="m-val m-class"></span></div>'
        +     '<div class="m-field"><span class="m-label m-label-seat"></span><span class="m-val m-seat"></span></div>'
        +     '<div class="m-field"><span class="m-label m-label-seq"></span><span class="m-val m-seq"></span></div>'
        +   '</div>'
        + '</div>'
        + '<div class="m-tear"></div>'
        + '<div class="m-barcode">'
        +   '<img class="m-bc-img" alt="PDF417 barcode">'
        + '</div>'
    return card
}

function updateMockerCard(idx) {
    var r = rows[idx]
    if (!r) return
    var card = document.getElementById('mockerGallery').children[idx]
    if (!card) return

    var dl = (r.date || todayInputValue()).split('-')
    var mon = parseInt(dl[1]) - 1
    var mday = parseInt(dl[2])
    var dispDate = padLeft('' + mday, 2) + MON_NAMES[mon]

    card.querySelector('.m-name').textContent   = ((r.lastName || '') + '/' + (r.firstName || '')).toUpperCase()
    card.querySelector('.m-pnr').textContent    = (r.bookRef || '').toUpperCase()
    card.querySelector('.m-from').textContent   = (r.from || '').toUpperCase()
    card.querySelector('.m-to').textContent     = (r.to || '').toUpperCase()
    card.querySelector('.m-flight').textContent = ((r.fOp || '') + (r.fNum || '')).toUpperCase()
    card.querySelector('.m-date').textContent   = dispDate
    var clsEl = card.querySelector('.m-class')
    clsEl.textContent = t(CLS_KEYS[r.cls] || 'cls_economy')
    clsEl.className = 'm-val m-class m-class-' + (r.cls || 'Y')
    card.querySelector('.m-seat').textContent   = (r.seat || '').toUpperCase()
    card.querySelector('.m-seq').textContent    = (r.seqNum || '')

    var ttxt = buildBcbpText(r)
    run(1, ttxt, 0, 6)
    setImgSvg(card.querySelector('.m-bc-img'), textOut)
}

function printPasses() { window.print() }

function clearAll() {
    if (!confirm(t('confirm_clear'))) return
    rows = [defaultRow()]
    activeRowIdx = 0
    renderTable()
    rebuildGallery()
    updateAll()
    saveRows()
}

function toggleAdvanced() {
    var box = document.getElementById('advanced')
    var btn = document.getElementById('advToggle')
    var open = box.classList.toggle('open')
    btn.textContent = open ? t('adv_open') : t('adv_closed')
}

<style>

}

h1 {

}

}
h2 {

}

#errMsg {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--danger);
    font-size: 13px;
    background-color: var(--danger-bg);

}

.toolbar {
    display: flex;

    margin-bottom: 10px;

}
.toolbar button {
    cursor: pointer;
    padding: 7px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 5px;
    font-size: 13px;
    transition: all 0.15s;
}
.toolbar button:hover {
    border-color: var(--accent);

}
.toolbar .primary {

}
.toolbar .primary:hover {

}

}

#tableWrap {

}

}

/* ------- Boarding pass mocker (always light/paper) -------
   Target aspect ratio: ~2:1 to 2.4:1 to match IATA ATB2 (≈2.46:1) */
#mockerGallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
    gap: 18px;
    margin-bottom: 24px;
}
.mocker {
    background: #fff;

    border-radius: 10px;

    display: flex;

}
.mocker .m-header {
    background: linear-gradient(135deg, #003a70 0%, #0056b3 100%);

    padding: 9px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.mocker .m-title {
    font-size: 13px;

}
.mocker .m-passnum {

}
.mocker .m-val {
    font-size: 13px;

}
.mocker .m-top-row {

.mocker .m-name-field { flex: 1; min-width: 0; }
